{% extends "base.html" %} {% block title %} {{ title }} {% endblock %} {% block head %} {% endblock %} {% block individual_page_contents %}

<section id="login">
  <h1>LOGIN</h1>
  <div id="login__center">
    <form hx-post="/login" hx-target="#login__center__response" hx-swap="outerHTML">
      <label for="email_input">EMAIL:</label>
      <input type="text" id="login__center__email" name="email_input" autocomplete="on"/>

      <label for="password_input">PASSWORD:</label>
      <input type="password" id="login__center__password" name="password_input" autocomplete="on"/>
      <button type="submit">SUBMIT</button>
    </form>
  </div>
  <div id="login__response">
    <h4>Server Response</h4>
    <div>
      {% for (i, data) in content.iter().enumerate() %}
      {{i}} -> {{ data }}
      {% endfor %}
    </div>
  </div>
</section>


{% call super() %} {% endblock %}
